name: Синхронизация с каналом

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрать новые посты из канала
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python scripts/sync.py
      - name: Сохранить изменения
        run: |
          git config user.name "zamok-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js scripts/state.json
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "Оглавление: новые посты из канала"
          git push
